<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Helpdesk Ticket System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>


<body>

<div style="
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: #f4f7fb;
    box-sizing: border-box;
">


    <!-- Login Card -->

    <div style="
        width: 100%;
        max-width: 400px;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
    ">


        <!-- Heading -->

        <h2 style="
            text-align: center;
            margin: 0 0 25px 0;
            color: #1f2937;
        ">
            Helpdesk Login
        </h2>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >


            <!-- Username -->

            <div style="
                margin-bottom: 18px;
            ">

                <label
                    for="username"
                    style="
                        display: block;
                        margin-bottom: 6px;
                        color: #374151;
                    "
                >
                    <strong>Username</strong>
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                    style="
                        width: 100%;
                        padding: 10px 12px;
                        box-sizing: border-box;
                        border: 1px solid #b8b8b8;
                        border-radius: 4px;
                        outline: none;
                        font-size: 14px;
                        background: #fff;
                    "
                >

            </div>


            <!-- Password -->

            <div style="
                margin-bottom: 20px;
            ">

                <label
                    for="password"
                    style="
                        display: block;
                        margin-bottom: 6px;
                        color: #374151;
                    "
                >
                    <strong>Password</strong>
                </label>


                <div style="
                    position: relative;
                ">


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                        style="
                            width: 100%;
                            padding: 10px 38px 10px 12px;
                            box-sizing: border-box;
                            border: 1px solid #b8b8b8;
                            border-radius: 4px;
                            outline: none;
                            font-size: 14px;
                            background: #fff;
                        "
                    >


                    <!-- Professional Eye Icon -->

                    <button
                        type="button"
                        onclick="togglePassword(this)"
                        aria-label="Show password"
                        style="
                            position: absolute;
                            right: 8px;
                            top: 50%;
                            transform: translateY(-50%);
                            border: none;
                            background: transparent;
                            padding: 2px;
                            cursor: pointer;
                            color: #555;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        "
                    >

                        <svg
                            class="eye-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <!-- CLOSED / SLASHED EYE -->

                            <path d="M3 3l18 18"></path>

                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>

                            <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8"></path>

                            <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8c1.8 0 3.3-.5 4.6-1.2"></path>

                        </svg>

                    </button>


                </div>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                style="
                    width: 100%;
                    padding: 12px;
                    background: #2563eb;
                    color: white;
                    border: none;
                    border-radius: 6px;
                    cursor: pointer;
                    font-size: 16px;
                    font-weight: 600;
                "
            >
                Login
            </button>


        </form>


        <!-- Signup Link -->

        <div style="
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        ">

            <span>
                Don't have an account?
            </span>

            <a
                href="{{ url_for('signup') }}"
                style="
                    color: #2563eb;
                    text-decoration: none;
                    font-weight: 600;
                "
            >
                Create Account
            </a>

        </div>


    </div>

</div>


<!-- Password Toggle -->

<script>

    function togglePassword(button) {

        const passwordInput =
            document.getElementById("password");

        const eyeIcon =
            button.querySelector(".eye-icon");


        if (passwordInput.type === "password") {

            /*
             * Password is hidden.
             * Show the password.
             */

            passwordInput.type = "text";


            /*
             * OPEN EYE
             */

            eyeIcon.innerHTML = `

                <path
                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                ></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>

            `;


            button.setAttribute(
                "aria-label",
                "Hide password"
            );


        } else {

            /*
             * Password is visible.
             * Hide the password.
             */

            passwordInput.type = "password";


            /*
             * CLOSED / SLASHED EYE
             */

            eyeIcon.innerHTML = `

                <path d="M3 3l18 18"></path>

                <path
                    d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                ></path>

                <path
                    d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8"
                ></path>

                <path
                    d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8c1.8 0 3.3-.5 4.6-1.2"
                ></path>

            `;


            button.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }

</script>


</body>

</html>
