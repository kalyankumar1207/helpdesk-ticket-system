{% extends "base.html" %}

{% block title %}Create Ticket - Helpdesk Ticket System{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Create New Ticket</h1>
        <p>Enter the details below to create a new helpdesk ticket.</p>
    </div>
</div>


<div class="form-card">

    <form method="POST" action="{{ url_for('create_ticket_page') }}">

        <!-- Title -->
        <div class="form-group">
            <label for="title">
                Title <span class="required">*</span>
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ request.form.get('title', '') }}"
                placeholder="Enter ticket title"
                required
            >
        </div>


        <!-- Description -->
        <div class="form-group">
            <label for="description">
                Description <span class="required">*</span>
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Describe the issue in detail"
                required
            >{{ request.form.get('description', '') }}</textarea>
        </div>


        <!-- Category -->
        <div class="form-group">
            <label for="category">
                Category <span class="required">*</span>
            </label>

            <select
                id="category"
                name="category"
                required
            >

                <option value="">
                    Select Category
                </option>

                {% for category in categories %}

                <option
                    value="{{ category }}"
                    {% if request.form.get('category') == category %}selected{% endif %}
                >
                    {{ category }}
                </option>

                {% endfor %}

            </select>
        </div>


        <!-- Priority -->
        <div class="form-group">
            <label for="priority">
                Priority <span class="required">*</span>
            </label>

            <select
                id="priority"
                name="priority"
                required
            >

                <option value="">
                    Select Priority
                </option>

                {% for priority in priorities %}

                <option
                    value="{{ priority }}"
                    {% if request.form.get('priority') == priority %}selected{% endif %}
                >
                    {{ priority }}
                </option>

                {% endfor %}

            </select>
        </div>


        <!-- Status -->
        <div class="form-group">
            <label for="status">
                Status <span class="required">*</span>
            </label>

            <select
                id="status"
                name="status"
                required
            >

                <option value="">
                    Select Status
                </option>

                {% for status in statuses %}

                <option
                    value="{{ status }}"
                    {% if request.form.get('status') == status %}selected{% endif %}
                >
                    {{ status }}
                </option>

                {% endfor %}

            </select>
        </div>


        <!-- Assigned To -->
        <div class="form-group">
            <label for="assigned_to">
                Assigned To <span class="required">*</span>
            </label>

            <input
                type="text"
                id="assigned_to"
                name="assigned_to"
                value="{{ request.form.get('assigned_to', '') }}"
                placeholder="Enter assignee name"
                required
            >
        </div>


        <!-- Buttons -->
        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Ticket
            </button>

            <a
                href="{{ url_for('tickets') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
